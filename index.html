    <!-- Converse.js CSS Asli -->
    <link rel="stylesheet" href="https://cdn.conversejs.org/10.1.5/css/converse.min.css">

    <style>
        /* =========================================
           TEMA HERMES CHAT (Override Converse.js)
           ========================================= */
        :root {
            --converse-primary-color: #1E2749;       
            --converse-secondary-color: #F4B41A;     
            --converse-link-color: #F4B41A;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            background-color: #f4f5f7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        #conversejs-wrapper { height: 100%; width: 100%; }

        #conversejs .navbar,
        #conversejs .chat-head,
        #conversejs .controlbox-head,
        #conversejs .chat-head-chatbox {
            background-color: #1E2749 !important;
            color: #FFFFFF !important;
            border: none !important;
        }

        #conversejs .chat-head .chat-title,
        #conversejs .controlbox-head .controlbox-title,
        #conversejs .navbar-brand {
            color: #F4B41A !important;
            font-weight: bold !important;
        }

        #conversejs .chat-head a.icon, 
        #conversejs .controlbox-head a.icon { color: #FFFFFF !important; }

        #conversejs .btn-primary {
            background-color: #F4B41A !important;
            color: #1E2749 !important;
            border: none !important;
            border-radius: 8px !important;
            font-weight: bold;
        }

        #conversejs .btn-primary:hover { background-color: #e0a312 !important; }

        #conversejs .controlbox-pane {
            background-color: #ffffff !important;
            border-radius: 8px;
        }

        #conversejs input[type="text"], 
        #conversejs input[type="password"] {
            border-radius: 6px !important;
            border: 1px solid #ccc !important;
            padding: 10px !important;
        }

        #conversejs input[type="text"]:focus, 
        #conversejs input[type="password"]:focus {
            border-color: #F4B41A !important;
            box-shadow: 0 0 5px rgba(244, 180, 26, 0.5) !important;
        }

        #conversejs .chat-content {
            background-color: #e5ddd5 !important;
            background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M20 20.5V18H0v-2h20v-2H0v-2h20v-2H0V8h20V6H0V4h20V2H0V0h22v20h2V0h2v20h2V0h2v20h2V0h2v20h2V0h2v20h2v2H20v-1.5zM0 20h2v20H0V20zm4 0h2v20H4V20zm4 0h2v20H8V20zm4 0h2v20h-2V20zm4 0h2v20h-2V20zm4 4h20v2H20v-2zm0 4h20v2H20v-2zm0 4h20v2H20v-2zm0 4h20v2H20v-2z' fill='%231e2749' fill-opacity='0.04' fill-rule='evenodd'/%3E%3C/svg%3E");
        }

        #conversejs .message.chat-msg { border-radius: 8px !important; }
        
        #conversejs .roster-contacts .roster-contact {
            border-bottom: 1px solid #f0f0f0 !important;
            padding: 10px !important;
        }
        
        #conversejs .roster-contacts .roster-contact:hover {
            background-color: #f9f9f9 !important;
            border-left: 4px solid #F4B41A !important;
        }

        #conversejs.converse-fullscreen .chatbox .box-flyout {
            border: none !important;
            border-radius: 0 !important;
            box-shadow: none !important;
        }
    </style>
</head>
<body>

    <div id="conversejs-wrapper"></div>

    <!-- Converse.js JS Asli -->
    <script src="https://cdn.conversejs.org/10.1.5/dist/converse.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Mesin Converse.js Penuh
            converse.initialize({
                bosh_service_url: 'https://conversejs.org/http-bind/', // BOSH publik yang stabil
                view_mode: 'fullscreen',       
                root: document.getElementById('conversejs-wrapper'),
                show_controlbox_by_default: true,
                roster_groups: true,
                allow_registration: false,
                play_sounds: true,
                theme: 'default',
                i18n: 'id'                     
            });
        });

        // Registrasi Service Worker PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => console.log('Service Worker terdaftar!', reg.scope))
                    .catch((err) => console.log('Service Worker gagal:', err));
            });
        }
    </script>
</body>
</html>
